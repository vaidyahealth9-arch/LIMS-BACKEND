name: Deploy to Cloud Run

on:
  workflow_dispatch:

env:
  PROJECT_ID: vaidya-lims-dev
  REGION: asia-south1
  SERVICE: lims-backend
  REPO: vaidya-apps

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY_B64 }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Authorize Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Container
        run: |-
          docker build -t "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}" .
          docker push "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}"

      - name: Deploy to Cloud Run
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          flags: '--allow-unauthenticated --memory=4Gi --timeout=600 --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:lims-db-dev'
          env_vars: |-
            SPRING_PROFILES_ACTIVE=prod
            SPRING_CLOUD_GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            SPRING_CLOUD_GCP_SQL_INSTANCE_CONNECTION_NAME=${{ env.PROJECT_ID }}:${{ env.REGION }}:lims-db-dev
            SPRING_JPA_HIBERNATE_DDL_AUTO=update
            SPRING_FLYWAY_ENABLED=false
            LOGGING_LEVEL_ORG_HIBERNATE_SQL=DEBUG
            LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASICBINDER=TRACE
            LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB=DEBUG
            GCS_BUCKET_NAME=vaidya-lims-reports-dev
            REPORT_STORAGE_PROVIDER=gcs
            DB_USERNAME=postgres
            DB_NAME=lims
          secrets: |-
            DB_PASSWORD=lims-db-password:latest
            JWT_SECRET=lims-jwt-secret:latest
