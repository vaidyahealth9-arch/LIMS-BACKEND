# Google Cloud profile configuration
# Activate this profile with: SPRING_PROFILES_ACTIVE=prod,gcp (or gcp)

# Google Cloud SQL configuration
spring.cloud.gcp.sql.enabled=false
# Cloud SQL autoconfig disabled for Cloud Run deployments. Use direct JDBC URL below.
# If you prefer to enable the Cloud SQL environment post-processor, set the instance
# and database via the DB_NAME / GCP_SQL_INSTANCE environment variables.
# spring.cloud.gcp.sql.instance-connection-name=${GCP_SQL_INSTANCE:halelab-469206:asia-south1:hale-stg}
# spring.cloud.gcp.sql.database-name=${DB_NAME:postgres}

# Direct Spring DataSource for GCP-managed Cloud Run (Cloud SQL proxy listens on localhost)
## Connect to Cloud SQL using the Cloud SQL Socket Factory (works on Cloud Run)
# This uses the Cloud SQL Java socket factory to connect securely without requiring a mounted
# unix socket. The instance connection name must be provided.
## Connect to Cloud SQL via Unix socket mounted by Cloud Run at /cloudsql/<INSTANCE>
# Use percent-encoded socket path as the JDBC host to connect over a Unix domain socket.
# Example host portion: %2Fcloudsql%2F{PROJECT_ID}%3A{REGION}%3A{INSTANCE_NAME}
## Use Cloud SQL Java Socket Factory to connect via the Cloud Run connector by targeting localhost
# The connector intercepts localhost:5432 and routes to the instance specified in cloudSqlInstance.
spring.datasource.url=jdbc:postgresql://localhost:5432/lims?cloudSqlInstance=lims-dev-001:asia-south1:lims-sql&socketFactory=com.google.cloud.sql.postgres.SocketFactory&sslmode=disable&options=-c%20TimeZone=UTC
spring.datasource.username=${DB_USERNAME:lims_user}
spring.datasource.password=${DB_PASSWORD:}

# Prevent the datasource from failing the application startup if the DB isn't immediately reachable
# (HikariCP will not fail fast). This allows the service to bind the HTTP port while DB connect
# attempts continue in the background; run migrations separately.
spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.initialization-mode=never

# Make startup resilient in managed deployments: disable automatic migrations/DDL at startup
# (we still recommend running Flyway migrations via CI/CD or a maintenance job)
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# Google Cloud Project ID
gcp.project.id=${GCP_PROJECT_ID:halelab-469206}
spring.cloud.gcp.project-id=${gcp.project.id}

# Secret Manager integration
spring.cloud.gcp.secretmanager.enabled=${GCP_SECRETMANAGER_ENABLED:true}

# GCS bucket settings
spring.cloud.gcp.storage.bucket-name=${GCS_BUCKET_NAME:halelab-assets}
gcs.default.bucket.name=${GCS_BUCKET_NAME:halelab-assets}

# Cloud report storage mode
app.report.storage.provider=${REPORT_STORAGE_PROVIDER:gcs}
