# PRODUCTION CONFIGURATION - VAIDYA LIMS DEV
spring.application.name=lims

# Database Configuration
spring.cloud.gcp.sql.enabled=true
spring.cloud.gcp.sql.instance-connection-name=vaidya-lims-dev:asia-south1:lims-db-dev
spring.cloud.gcp.sql.database-name=lims
spring.datasource.username=postgres

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable Flyway for the initial schema build
spring.flyway.enabled=false

# Google Cloud Project & Storage
gcp.project.id=vaidya-lims-dev
spring.cloud.gcp.project-id=vaidya-lims-dev
spring.cloud.gcp.storage.bucket-name=vaidya-lims-reports-dev
gcs.default.bucket.name=vaidya-lims-reports-dev
app.report.storage.provider=gcs

# Secret Manager
spring.cloud.gcp.secretmanager.enabled=true

# Server Configuration
server.port=8080
server.address=0.0.0.0

# Logging
logging.level.org.springframework.data=DEBUG
logging.level.org.hibernate=INFO
