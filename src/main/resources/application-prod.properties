# PRODUCTION CONFIGURATION - VAIDYA LIMS DEV
spring.application.name=lims

# Database Configuration
spring.cloud.gcp.sql.enabled=true
spring.cloud.gcp.sql.instance-connection-name=${GCP_SQL_INSTANCE:vaidya-lims-dev:asia-south1:lims-db-dev}
spring.cloud.gcp.sql.database-name=${DB_NAME:lims}
spring.datasource.username=${DB_USERNAME:postgres}

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Google Cloud Project & Storage
gcp.project.id=${GCP_PROJECT_ID:vaidya-lims-dev}
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:vaidya-lims-dev}
spring.cloud.gcp.storage.bucket-name=${GCS_BUCKET_NAME:vaidya-lims-reports-dev}
gcs.default.bucket.name=${GCS_BUCKET_NAME:vaidya-lims-reports-dev}
app.report.storage.provider=${REPORT_STORAGE_PROVIDER:gcs}

# Secret Manager
spring.cloud.gcp.secretmanager.enabled=${GCP_SECRETMANAGER_ENABLED:true}

# CORS (allow frontend origins, overridable via env var)
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}

# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# Logging (reduce to INFO for production, override via env if needed)
logging.level.org.springframework.data=${LOG_LEVEL_DATA:INFO}
logging.level.org.hibernate=INFO
logging.level.com.halo.lims=INFO
