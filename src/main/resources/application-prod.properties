# PRODUCTION CONFIGURATION - VAIDYA LIMS (GCP Cloud Run)

# Database Configuration — Cloud SQL via Spring Cloud GCP connector
spring.cloud.gcp.sql.enabled=true
spring.cloud.gcp.sql.instance-connection-name=${GCP_SQL_INSTANCE:vaidya-lims-dev:asia-south1:lims-db-dev}
spring.cloud.gcp.sql.database-name=${DB_NAME:lims}
spring.datasource.username=${DB_USERNAME:postgres}

# Google Cloud Project & Storage
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:vaidya-lims-dev}
spring.cloud.gcp.storage.bucket-name=${GCS_BUCKET_NAME:vaidya-lims-reports-dev}

# Report Storage — always GCS in production
app.report.storage.provider=${REPORT_STORAGE_PROVIDER:gcs}

# AES-GCM Encryption — Secret Manager is required in production
spring.cloud.gcp.secretmanager.enabled=${GCP_SECRETMANAGER_ENABLED:true}
encryption.secret-manager.key-name=${ENCRYPTION_KEY_NAME:lims-aes-256-key}

# Hibernate & JPA — validate schema (never mutate in production; use Flyway)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway — enabled in production; runs automatically on startup
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.validate-on-migrate=false

# PDF report cache — enable in production to reduce PDF regeneration load
app.report.cache.enabled=${REPORT_CACHE_ENABLED:true}
app.report.cache.max-size=${REPORT_CACHE_MAX_SIZE:200}
app.report.cache.ttl-minutes=${REPORT_CACHE_TTL_MINUTES:30}

# Swagger / OpenAPI — DISABLED in production (never expose API docs publicly)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# CORS — must be set explicitly via env var; no default wildcard
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}

# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# Logging — INFO in production; override via env if needed
logging.level.root=INFO
logging.level.org.springframework.data=${LOG_LEVEL_DATA:INFO}
logging.level.org.hibernate=INFO
logging.level.com.halo.lims=INFO
