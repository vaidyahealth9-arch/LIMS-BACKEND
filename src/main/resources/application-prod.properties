# Google Cloud profile configuration
# Activate this profile with: SPRING_PROFILES_ACTIVE=prod,gcp (or gcp)

# Google Cloud SQL configuration
spring.cloud.gcp.sql.enabled=true
spring.cloud.gcp.sql.instance-connection-name=${GCP_SQL_INSTANCE:vaidya-lims-dev:asia-south1:lims-db-dev}
spring.cloud.gcp.sql.database-name=${DB_NAME:postgres}

# Google Cloud Project ID
gcp.project.id=${GCP_PROJECT_ID:vaidya-lims-dev}
spring.cloud.gcp.project-id=${gcp.project.id}

# Secret Manager integration
spring.cloud.gcp.secretmanager.enabled=${GCP_SECRETMANAGER_ENABLED:true}

# GCS bucket settings
spring.cloud.gcp.storage.bucket-name=${GCS_BUCKET_NAME:vaidya-lims-reports-dev}
gcs.default.bucket.name=${GCS_BUCKET_NAME:vaidya-lims-reports-dev}

# Cloud report storage mode
app.report.storage.provider=${REPORT_STORAGE_PROVIDER:gcs}
