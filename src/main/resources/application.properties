server.port=${PORT:8080}
spring.application.name=lims

# Base datasource credentials (the URL/Cloud SQL wiring is profile-specific)
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate DDL auto (production-safe default). Override with JPA_DDL_AUTO only when needed.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway migration controls (safe for existing environments without flyway_schema_history)
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

# Cloud provider integrations are configured in profile-specific files
spring.cloud.gcp.secretmanager.enabled=${GCP_SECRETMANAGER_ENABLED:false}

# Secret Manager secret name for the encryption key
# This secret should contain a Base64 encoded 32-byte (256-bit) AES key
encryption.secret-manager.key-name=${ENCRYPTION_KEY_NAME:lims-aes-256-key}

# Report storage defaults (overridden by cloud profiles)
app.report.storage.provider=${REPORT_STORAGE_PROVIDER:local}
app.report.storage.local.base-path=${REPORT_STORAGE_LOCAL_BASE_PATH:./data/lims-reports}
app.report.delete.enabled=${REPORT_DELETE_API_ENABLED:false}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400}

# CORS allowed origin patterns (comma-separated). Override per environment.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://hale-lims-web-322945089195.asia-south1.run.app}

# Internal service communication (LIMS <-> PHR)
app.environment=${ENVIRONMENT:development}
app.internal.auth.mode=${INTERNAL_AUTH_MODE:auto}
app.internal.secret-key=${INTERNAL_SECRET_KEY:}
app.internal.allowed-service-accounts=${INTERNAL_ALLOWED_SERVICE_ACCOUNTS:}
app.internal.lims-audience=${LIMS_SERVICE_URL_CLOUD:${LIMS_SERVICE_URL:http://localhost:8080}}
app.internal.phr-base-url=${PHR_SERVICE_URL:http://localhost:8000}
app.internal.phr-base-url-cloud=${PHR_SERVICE_URL_CLOUD:}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
