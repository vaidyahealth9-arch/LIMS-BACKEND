server.port=8080
spring.application.name=lims

# PostgreSQL configuration for local development
# Replace your_database_name, your_username, and your_password with your local database credentials
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate DDL auto (validate will validate the schema, use 'update' or 'create-drop' for development)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Google Cloud SQL for local profile
spring.cloud.gcp.sql.enabled=false
spring.cloud.gcp.core.enabled=false

# Use a simple in-memory secret for local development
jwt.secret=local-secret-key-local-secret-key-local-secret-key
jwt.expiration=86400