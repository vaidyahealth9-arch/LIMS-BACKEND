server.port=8080
spring.application.name=lims

# PostgreSQL configuration for local development
# Replace your_database_name, your_username, and your_password with your local database credentials
spring.cloud.gcp.sql.enabled=false
# spring.cloud.gcp.sql.instance-connection-name=jdbc:postgresql:///postgres?cloudSqlInstance=halelab-469206:asia-south1:hale-stg&socketFactory=com.google.cloud.sql.postgres.SocketFactory&socketFactoryIpTypes=PUBLIC
spring.datasource.url=jdbc:postgresql://localhost:5432/lims?options=-c%20TimeZone=UTC
spring.datasource.username=postgres
# spring.datasource.password=${sm://projects/halelab-469206/secrets/lims-db-password}
# For local development use the Docker Compose credentials (changeme) or your local DB password
spring.datasource.password=changeme
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate DDL auto (for local development, update will create/modify schema automatically)
# In production set this to 'none' and use migrations (Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway is available locally and can be enabled for migration testing.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

# Disable Google Cloud SQL for local profile
spring.cloud.gcp.core.enabled=false
spring.cloud.gcp.storage.enabled=false

# --- GCP Cloud Storage Configuration (Local) ---
# For local development, you can point to a specific bucket if needed
# Ensure you have authenticated via `gcloud auth application-default login`
spring.cloud.gcp.storage.bucket-name=your-local-dev-bucket # TODO: Replace with a real bucket for local testing
app.report.storage.provider=${REPORT_STORAGE_PROVIDER:local}
app.report.storage.local.base-path=${REPORT_STORAGE_LOCAL_BASE_PATH:./data/lims-reports}
app.media.storage.local-inline-fallback=${MEDIA_STORAGE_LOCAL_INLINE_FALLBACK:true}
app.report.delete.enabled=${REPORT_DELETE_API_ENABLED:true}

spring.cloud.gcp.secretmanager.enabled=false

# Google Cloud Project ID
gcp.project.id=halelab-469206

# Use a simple in-memory secret for local development
jwt.secret=local-secret-key-local-secret-key-local-secret-key
jwt.expiration=86400

# Allow local Vite dev servers
app.cors.allowed-origin-patterns=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173

# Internal service communication defaults (local)
app.environment=development
app.internal.auth.mode=${INTERNAL_AUTH_MODE:local}
app.internal.lims-audience=${LIMS_SERVICE_URL:http://localhost:8080}
app.internal.phr-base-url=${PHR_SERVICE_URL:http://localhost:8000}
app.internal.phr-base-url-cloud=${PHR_SERVICE_URL_CLOUD:}

# revoke auth - gcloud auth revoke --all
# get auth - gcloud auth application-default login
# proxy to local - cloud-sql-proxy.x64.exe halelab-469206:asia-south1:hale-stg --port 3306
#
