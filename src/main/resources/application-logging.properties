# Logging Configuration for LIMS Backend
# JSON-structured logging for ELK stack integration

# Root logger
logging.level.root=INFO

# Application logging
logging.level.com.halo.lims=DEBUG

# Spring Framework
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG

# Hibernate/JPA
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# JSON Logging Pattern
# Logs include: timestamp, level, logger, message, trace_id, thread
logging.pattern.console=%d{ISO8601} %-5level [%X{traceId}] [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{ISO8601} %-5level [%X{traceId}] [%thread] %logger{36} - %msg%n

# Async logging for better performance
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Log file output
logging.file.name=logs/lims-backend.log

# Correlation ID MDC filter is applied via RequestAuditLoggingFilter
