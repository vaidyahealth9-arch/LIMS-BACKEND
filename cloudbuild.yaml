steps:
  # Build image (no secrets in source)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - '${_DOCKERFILE}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '.'
  # Push image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
  # Deploy to Cloud Run (secrets only via Secret Manager references)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated=${_ALLOW_UNAUTHENTICATED}'
      - '--service-account'
      - '${_RUNTIME_SA}'
      - '--add-cloudsql-instances=${_GCP_SQL_INSTANCE}'
      - '--set-env-vars'
      - 'SPRING_PROFILES_ACTIVE=${_SPRING_PROFILES_ACTIVE},DB_NAME=${_DB_NAME},DB_USERNAME=${_DB_USERNAME},GCP_SQL_INSTANCE=${_GCP_SQL_INSTANCE},GCP_PROJECT_ID=$PROJECT_ID,GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},REPORT_STORAGE_PROVIDER=${_REPORT_STORAGE_PROVIDER},FLYWAY_ENABLED=${_FLYWAY_ENABLED},JPA_DDL_AUTO=${_JPA_DDL_AUTO},GCP_SECRETMANAGER_ENABLED=true'
      - '--update-env-vars'
      - 'CORS_ALLOWED_ORIGIN_PATTERNS=${_CORS_ALLOWED_ORIGIN_PATTERNS},INTERNAL_AUTH_MODE=${_INTERNAL_AUTH_MODE},INTERNAL_ALLOWED_SERVICE_ACCOUNTS=${_INTERNAL_ALLOWED_SERVICE_ACCOUNTS},PHR_SERVICE_URL_CLOUD=${_PHR_SERVICE_URL_CLOUD},INTERNAL_AUTH_AUDIENCE=${_INTERNAL_AUTH_AUDIENCE},APP_INTERNAL_SECRET_KEY=${_APP_INTERNAL_SECRET_KEY},ENVIRONMENT=production'
      - '--set-secrets=DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest,JWT_SECRET=${_JWT_SECRET_NAME}:latest'
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: 'asia-south1'
  _AR_REPO: 'vaidya-apps'
  _SERVICE_NAME: 'lims-backend'
  _DOCKERFILE: 'Dockerfile'
  _ALLOW_UNAUTHENTICATED: 'true'
  _RUNTIME_SA: '331736313956-compute@developer.gserviceaccount.com'
  _SPRING_PROFILES_ACTIVE: 'prod,gcp'
  _DB_NAME: 'lims'
  _DB_USERNAME: 'postgres'
  _GCP_SQL_INSTANCE: 'vaidya-lims-dev:asia-south1:lims-db-dev'
  _GCS_BUCKET_NAME: 'vaidya-lims-reports-dev'
  _REPORT_STORAGE_PROVIDER: 'gcs'
  _FLYWAY_ENABLED: 'false'
  _JPA_DDL_AUTO: 'update'
  _CORS_ALLOWED_ORIGIN_PATTERNS: 'https://lims-web-gn255bmgma-el.a.run.app,https://lims-web-331736313956.asia-south1.run.app'
  _INTERNAL_AUTH_MODE: 'oidc'
  _INTERNAL_ALLOWED_SERVICE_ACCOUNTS: '299118511394-compute@developer.gserviceaccount.com'
  _PHR_SERVICE_URL_CLOUD: 'https://phr-backend-7gdssbdd4a-el.a.run.app'
  _INTERNAL_AUTH_AUDIENCE: 'https://phr-backend-299118511394.asia-south1.run.app'
  _APP_INTERNAL_SECRET_KEY: 'repair-fix-2026'
  # Secret resource names only (values stay in Secret Manager)
  _DB_PASSWORD_SECRET: 'lims-db-password'
